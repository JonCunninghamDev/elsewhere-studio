<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Observatory above the clouds</title>
  <desc id="desc">A warm observatory study overlooking clouds, distant floating cliffs, waterfalls and a crescent moon.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#172554"/>
      <stop offset="42%" stop-color="#334155"/>
      <stop offset="72%" stop-color="#b4535a"/>
      <stop offset="100%" stop-color="#f0a46c"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dbe7f3" stop-opacity=".22"/>
      <stop offset="50%" stop-color="#f4f6f8" stop-opacity=".86"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4b2c24"/>
      <stop offset="100%" stop-color="#211817"/>
    </linearGradient>
    <radialGradient id="lampGlow">
      <stop offset="0%" stop-color="#ffd58a" stop-opacity=".9"/>
      <stop offset="42%" stop-color="#f59e0b" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

